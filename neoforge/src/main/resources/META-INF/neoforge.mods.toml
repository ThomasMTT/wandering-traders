modLoader = "javafml"
loaderVersion = "[2,)"
displayURL = "${github_url}"
issueTrackerURL = "${github_url}/issues"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${displayname}"
authors = "${authors}"
description = '''
${description}
'''
logoFile = "${logo}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_simple_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"


[[mixins]]
config = "${mod_id}.mixins.json"
